name: Trigger auto deployment for openconnect

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ openvpn-v2.4 ]
    paths:
    - '**'
    - '.github/workflows/openconnect-AutoDeployTrigger-ea49b313-9b8e-4f42-84ed-fb8243162408.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.OPENCONNECT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.OPENCONNECT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.OPENCONNECT_AZURE_SUBSCRIPTION_ID }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          registryUrl: 
          registryUsername: ${{ secrets.OPENCONNECT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.OPENCONNECT_REGISTRY_PASSWORD }}
          containerAppName: openconnect
          resourceGroup: opentest
          imageToBuild: default/[parameters('containerAppName')]:${{ github.sha }}
          _buildArgumentsKey_: |
            _buildArgumentsValues_


